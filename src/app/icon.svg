<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Static frame of the header Orb (.orb.orbSm in portfolio.module.css). -->
  <defs>
    <radialGradient id="base" cx="50%" cy="45%" r="72%">
      <stop offset="0" stop-color="#1a2a5e"/>
      <stop offset="1" stop-color="#0b1533"/>
    </radialGradient>
    <radialGradient id="shine" cx="32%" cy="26%" r="30%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <clipPath id="disc"><circle cx="32" cy="32" r="32"/></clipPath>
  </defs>
  <g clip-path="url(#disc)">
    <rect width="64" height="64" fill="url(#base)"/>
    <g filter="url(#blur)" opacity="0.92" style="isolation:isolate">
      <circle cx="24" cy="27" r="23" fill="#2563eb" style="mix-blend-mode:screen"/>
      <circle cx="48" cy="36" r="23" fill="#22d3ee" style="mix-blend-mode:screen"/>
      <circle cx="35" cy="46" r="23" fill="#a855f7" style="mix-blend-mode:screen"/>
    </g>
    <rect width="64" height="64" fill="url(#shine)"/>
    <circle cx="32" cy="32" r="31.5" fill="none" stroke="#fff" stroke-opacity="0.14"/>
  </g>
</svg>
